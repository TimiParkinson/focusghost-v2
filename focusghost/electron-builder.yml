appId: com.focusghost.app
productName: FocusGhost
directories:
  output: release
files:
  - out/**/*
  - package.json
  - '!**/*.map'
asar: true
asarUnpack:
  - '**/node_modules/active-win/**/*'
publish:
  provider: github

# ---- macOS ----
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false  # set NOTARIZE=true at CI time when APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID are present
  # Signing identity is auto-detected from CSC_LINK + CSC_KEY_PASSWORD env vars (electron-builder convention)
dmg:
  sign: false
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# ---- Windows ----
win:
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: zip
      arch: [x64]
  # EV signing — populate via CSC_LINK (path or base64 of .pfx) + CSC_KEY_PASSWORD env vars in CI
  signtoolOptions:
    signingHashAlgorithms: [sha256]
    rfc3161TimeStampServer: http://timestamp.digicert.com
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

# ---- Linux ----
linux:
  category: Office
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64]
  maintainer: FocusGhost Team <hello@focusghost.app>
  vendor: FocusGhost
  synopsis: Desktop AI focus companion
  description: |
    FocusGhost watches your active window, learns when you're drifting from
    your declared task, and surfaces calm, AI-generated nudges from a
    friendly ghost mascot. Includes Stuck Mode, focus streaks, and
    session history.
