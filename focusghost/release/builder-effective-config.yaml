directories:
  output: release
  buildResources: build
appId: com.focusghost.app
productName: FocusGhost
files:
  - filter:
      - out/**/*
      - package.json
      - '!**/*.map'
asar: true
asarUnpack:
  - '**/node_modules/active-win/**/*'
publish:
  provider: github
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  sign: false
  contents:
    - x: 130
      'y': 220
    - x: 410
      'y': 220
      type: link
      path: /Applications
win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
  signingHashAlgorithms:
    - sha256
  rfc3161TimeStampServer: http://timestamp.digicert.com
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
linux:
  category: Office
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
    - target: rpm
      arch:
        - x64
  maintainer: FocusGhost Team <hello@focusghost.app>
  vendor: FocusGhost
  synopsis: Desktop AI focus companion
  description: |
    FocusGhost watches your active window, learns when you're drifting from
    your declared task, and surfaces calm, AI-generated nudges from a
    friendly ghost mascot. Includes Stuck Mode, focus streaks, and
    session history.
electronVersion: 30.5.1
